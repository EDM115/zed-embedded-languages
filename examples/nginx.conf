events {
    worker_connections 16;
}

http {
    server {
        listen 8080;
        server_name example.test;

        set $report_query "SELECT account_id, SUM(amount) AS total FROM invoices WHERE tenant_id = :tenant GROUP BY account_id;";
        set $report_payload '{"matrix": [[1], [2]], "visible": true}';
        set $preview "<h1>Orders & Payments</h1><p>Review the totals</p>";

        location / {
            default_type text/html;
            return 200 $preview;
        }
    }
}

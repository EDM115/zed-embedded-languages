[package]
categories = ["development-tools", "parser-implementations", "text-editors", "wasm"]
description = "Zed extension to add syntax highlighting in all strings"
edition = "2024"
keywords = ["embedded-language", "syntax-highlighting", "tree-sitter", "zed", "zed-extension"]
license = "MIT"
name = "embedded-languages-lsp"
publish = false
readme = "README.md"
repository = "https://github.com/EDM115/zed-embedded-languages"
version = "0.3.0"

[dependencies]
zed_extension_api = "0.7.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
incremental = true
lto = "fat"
opt-level = 3
overflow-checks = true
panic = "abort"
strip = true
